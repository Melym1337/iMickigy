<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMickigy</title>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <link rel="stylesheet" href="./style.css">
    
</head>
<body>

  <header>
    <div id="logo">iMickigy</div>
    <div class="tabs">
      <button class="tab active" data-mode="compress">Compress</button>
      <button class="tab" data-mode="resize">Resize</button>
      <button class="tab disabled" data-mode="collage">Collage</button>
    </div>
  </header>

  <main>

    <!-- Режим Compress -->
    <div id="mode-compress" class="mode-content active">
      <div class="controls">
        <button class="format-btn active" data-format="jpeg">JPEG</button>
        <button class="format-btn" data-format="webp">WebP</button>
        <button class="format-btn" data-format="png">PNG</button>
        <button class="format-btn" data-format="all">Select All</button>
        
        <label>
          Качество: <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.7">
          <span id="qualityValue">0.7</span>
        </label>

        <input type="file" id="upload" multiple accept="image/*" style="display:none">
        <button onclick="document.getElementById('upload').click()">+ Добавить фото</button>
        
        <button id="downloadAll">⬇ Скачать всё (zip)</button>
      </div>

      <div id="workspace">Перетащите фото сюда</div>
      <div id="fileList"></div>
    </div>

    <!-- Режим Resize -->
    <div id="mode-resize" class="mode-content">
      <div class="placeholder">
        <h2>Resize — скоро</h2>
        <p>Изменение размера без потери качества</p>
      </div>
    </div>

    <!-- Режим Collage -->
    <div id="mode-collage" class="mode-content">
      <div class="placeholder">
        <h2>Collage — скоро</h2>
        <p>Создание коллажей из фото</p>
      </div>
    </div>

  </main>

  <script type="module" src="./app.js"></script>

</body>
</html>

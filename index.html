<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMickigy</title>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; min-height: 100vh; }

    /* ── Шапка ── */
    #app-header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
    }

    #app-logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111;
      white-space: nowrap;
    }

    /* Табы режимов */
    #app-tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      user-select: none;
      position: relative;
    }
    .tab:hover:not(.tab--disabled) { border-color: #aaa; color: #222; }
    .tab--active { background: #111; color: #fff; border-color: #111; }
    .tab--disabled {
      color: #bbb;
      border-color: #eee;
      cursor: default;
    }
    .tab--disabled::after {
      content: 'soon';
      font-size: 9px;
      font-weight: 400;
      color: #bbb;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* ── Контент режима ── */
    #mode-content {
      padding: 16px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Контролы режима (общий стиль) ── */
    .mode-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .format-group { display: flex; align-items: center; gap: 5px; }
    .format-btn {
      padding: 6px 14px;
      border: 1.5px solid #ccc;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .format-btn:hover  { border-color: #888; }
    .format-btn.active { background: #111; color: #fff; border-color: #111; }
    .format-divider    { width: 1px; height: 20px; background: #ddd; margin: 0 2px; }

    .quality-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #555;
    }
    #qualityRange { width: 110px; }

    /* ── Дроп-зона ── */
    .dropzone {
      width: 100%;
      min-height: 220px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #fff;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 18px;
    }
    .dropzone.dropzone--active { border-color: #555; background: #f4f4f4; }
    .drop-hint { color: #bbb; font-size: 15px; pointer-events: none; }

    /* ── Карточки ── */
    .file-list { display: flex; flex-wrap: wrap; gap: 12px; }

    .file-card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px;
      width: 200px;
      font-size: 12px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-status { font-size: 11px; color: #aaa; }
    .card-status--done       { color: #2a9d2a; }
    .card-status--error      { color: #c00; }
    .card-status--processing { color: #e07b00; }
    .card-remove { background: none; border: none; cursor: pointer; color: #ccc; font-size: 14px; padding: 0 2px; }
    .card-remove:hover { color: #555; }
    .card-preview { height: 110px; background: #f0f0f0; border-radius: 6px; overflow: hidden; }
    .card-preview img { width: 100%; height: 100%; object-fit: cover; }
    .card-preview-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:20px; }
    .card-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#444; font-size:11px; }
    .card-original-size { color: #999; font-size: 11px; }
    .card-single { display:flex; align-items:center; gap:6px; font-size:12px; }
    .card-single--waiting { color: #bbb; }
    .card-fmt-label { font-weight:700; color:#444; font-size:11px; }
    .card-size-info { color:#666; }
    .card-savings { font-weight:700; }
    .savings--pos { color: #2a9d2a; }
    .savings--neg { color: #c00; }
    .card-actions { display:flex; gap:5px; flex-wrap:wrap; }
    .card-actions button { font-size:11px; padding:3px 8px; cursor:pointer; border:1px solid #ddd; border-radius:4px; background:#fff; }
    .card-actions button:hover { background: #f5f5f5; }
    .card-all-formats { display:flex; gap:4px; }
    .fmt-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 3px; border-radius:6px; border:1.5px solid #eee; font-size:11px; cursor:default; position:relative; }
    .fmt-col--done { cursor:pointer; border-color:#ddd; }
    .fmt-col--done:hover { border-color:#888; background:#fafafa; }
    .fmt-col--waiting    { color:#ccc; border-style:dashed; }
    .fmt-col--processing { color:#e07b00; border-color:#f5d9b5; }
    .fmt-col--error      { color:#c00; border-color:#fcc; }
    .fmt-label   { font-weight:700; color:#555; font-size:10px; }
    .fmt-size    { color:#999; font-size:10px; }
    .fmt-savings { font-weight:700; font-size:12px; }
    .fmt-compare-btn { position:absolute; top:2px; right:2px; background:none; border:none; cursor:pointer; color:#bbb; font-size:10px; padding:0; }
    .fmt-compare-btn:hover { color:#333; }

    /* ── Заглушка режима ── */
    .mode-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 300px;
      color: #aaa;
      text-align: center;
    }
    .placeholder-icon  { font-size: 40px; }
    .placeholder-title { font-size: 18px; font-weight: 700; color: #888; }
    .placeholder-desc  { font-size: 14px; max-width: 300px; line-height: 1.5; }
    .placeholder-files { font-size: 12px; color: #2a9d2a; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- Шапка с логотипом и табами -->
  <header id="app-header">
    <div id="app-logo">iMickigy</div>

    <nav id="app-tabs">
      <button class="tab" data-mode="compress">Compress</button>
      <button class="tab" data-mode="resize">Resize</button>
      <button class="tab tab--disabled" data-mode="collage">Collage</button>
      <button class="tab tab--disabled" data-mode="convert">Convert</button>
    </nav>
  </header>

  <!-- Контейнер — сюда монтируются режимы -->
  <main id="mode-content"></main>

  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script type="module" src="./app.js"></script>

</body>
</html>
